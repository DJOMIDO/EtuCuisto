<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="http://i3l.univ-grenoble-alpes.fr/~maxiao/EtuCuisto/Scripts/jquery-3.6.0.min.js"></script>
    <link rel="icon" href="http://i3l.univ-grenoble-alpes.fr/~maxiao/EtuCuisto/Images/etucuisto_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="http://i3l.univ-grenoble-alpes.fr/~maxiao/EtuCuisto/CSS/login.css">
    <title>Bienvenue</title>
</head>

<body>
    <!-- Module connexion -->
    <div class="Main-container">
        <div class="container-login">
            <div class="wrap-login">

                <div class="login-pic">
                    <img src="http://i3l.univ-grenoble-alpes.fr/~maxiao/EtuCuisto/Images/EtuCuisto.svg" alt="IMG">
                </div>

                <div class="login-form">
                    <span class="login-form-title">Bienvenue sur </br>EtuCuisto &#128522;</span>

                    <div class="wrap-input">
                        <input type="text" class="input" id="login" placeholder="Identifiant" required>
                        <span class="focus-input"></span>
                        <span class="symbol-input">
                            <i class="fa fa-user" aria-hidden="true"></i>
                        </span>
                    </div>
                    <div class="wrap-input">
                        <input type="password" class="input" id="mdp" placeholder="Mot de passe" required>
                        <span class="focus-input"></span>
                        <span class="symbol-input">
                            <i class="fa fa-lock" aria-hidden="true"></i>
                        </span>
                    </div>

                    <div class="login-form-btn-container">
                        <button class="login-form-btn" id="ok">OK</button>
                    </div>

                    <div class="text-center p-t-1">
                        <a href="#" class="txt2"> Identifiant / Mot de passe</a>
                        <span class="txt1">oublié ?</span>
                    </div>
                    <div class="text-center p-t-2">
                        <a href="#" class="txt2" onclick="document.getElementById('id01').style.display='block'">Créer
                            un compte <i class="fa fa-arrow-right" aria-hidden="true"></i></a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="id01" class="w3-modal">
        <div class="w3-modal-content w3-round-large w3-card-4 w3-animate-zoom" style="max-width:500px">

            <div class="w3-center"><br>
                <span onclick="document.getElementById('id01').style.display='none'"
                    class="w3-button w3-xlarge w3-hover-black w3-display-topright" title="Close Modal">&times;</span>
            </div>

            <!-- Module inscription -->
            <div class="w3-container">
                <div class="w3-section w3-center">
                    <h2>Inscription</h2>
                </div>
                <form id="inscriptionform" class="w3-section">
                    <label><b>Identifiant</b></label>
                    <input class="w3-input w3-border w3-margin-bottom w3-round-xxlarge" type="text" id="usrn"
                        name="usrname" value="" required>
                    <label><b>Mot de passe</b></label>
                    <input class="w3-input w3-border w3-round-xxlarge" type="password" id="pswd" name="psw" value=""
                        required>
                    <button class="w3-button w3-block w3-green w3-section w3-padding w3-round-xxlarge w3-hover-black"
                        type="submit" id="btnvld" value="Submit">S'inscrire</button>
                </form>
                <div class="w3-round-large w3-padding-16">
                    <button onclick="document.getElementById('id01').style.display='none'" type="button"
                        class="w3-button w3-red w3-round-xxlarge w3-hover-black">Annuler</button>
                </div>
                <!-- Le résultat de la réponse AJAX sera affiché à l'intérieur de ce div. -->
                <div id="result"></div>
            </div>

        </div>

    </div>

    <script>
        // Connexion
        $("#ok").on("click", function () {
            // Récupération du login et du mdp saisis dans le formulaire
            let login = $("#login").val();
            let mdp = $("#mdp").val();
            // Requête ajax pour interrogation de la BD
            $.ajax({
                method: 'post',
                url: 'verifAuthentif.php',
                data: { 'login': login, 'mdp': mdp },
                dataType: 'html',
                success: function (reponse, statut) {
                    if (reponse == "Authenification réussie") {
                        window.location.href = "accueil.html";
                    } else {
                        alert("Connexion échouée : " + reponse);
                    }
                }
            });
        });

        // Inscription
        $(document).on('click', '#btnvld', function (e) {

            e.preventDefault();

            var username = $('#usrn').val();
            var password = $('#pswd').val();
            if (username == '') {
                alert('Champ obligatoire : Veuillez saisir un login ! ');
            }
            else if (password == '') {
                alert('Champ obligatoire : Veuillez saisir un mot de passe ! ');
            }
            else {
                $.ajax({
                    url: 'inscription.php',
                    type: 'POST',
                    data:
                    {
                        newusername: username,
                        newpassword: password
                    },
                    success: function (response) {
                        $('#result').html(response);
                    }
                });
                $('#inscriptionform')[0].reset();
            }
        });
    </script>

</body>

</html>
